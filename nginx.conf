server {
    listen 80 default_server;
    server_name mpcaudio.boy.dev;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # WebUSB is the whole point of this page; everything else denied.
    add_header Permissions-Policy "usb=(self), microphone=(), camera=(), geolocation=(), payment=()" always;
    # 'wasm-unsafe-eval': the bundled xz decoder (xz-embedded compiled to WebAssembly).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'" always;

    location = /healthz { default_type text/plain; add_header Cache-Control "no-store"; try_files /healthz =404; }
    location = /version.json { default_type application/json; add_header Cache-Control "no-store"; try_files /version.json =404; }
    location = /patch.bin { default_type application/octet-stream; add_header Cache-Control "no-cache"; try_files /patch.bin =404; }
    location ~* \.(css|js)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
