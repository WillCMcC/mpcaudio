# mpc-uac2 add-on: copy the MPC main out into the USB-B audio gadget (standalone only).
# Off switches: file MPC-UAC2-OFF on any USB stick/SD card · /data/mpc-uac2/disabled · auto (crash-loop failsafe)
[Service]
Environment=LD_PRELOAD=/usr/libexec/mpc-uac2/mpc_uac2_tee.so
Environment=MPC_TEE_LOG=/tmp/mpc-uac2-tee.log
ExecStartPre=-/bin/sh /usr/libexec/mpc-uac2/mpc-uac2-prestart.sh
